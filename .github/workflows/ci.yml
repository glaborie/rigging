name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra service --extra mcp
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "not live and not browser" --cov=rigging --cov-report=term-missing
        env:
          RIGGING_DB_PATH: rigging.db

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra service --extra browser
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser
