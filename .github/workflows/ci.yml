name: ci

# Run only when something the suite can actually verify changed. The tests load
# files from examples/ (test_cli, test_eval, test_demo, test_manifest), scripts/
# (test_atif, test_bench, test_seal_pii) and redteam/ (test_redteam_provider), so
# those count as code. Docs, ADRs and top-level markdown do not: a README edit
# needs no ruff, no mypy and no Chromium.
#
# Add a path here when a new directory becomes part of what CI loads; the
# allowlist means an unlisted one is silently untested.
#
# CodeQL is not this workflow. It is GitHub's *default setup* for code scanning
# (`dynamic/github-code-scanning/codeql`): there is no file for it in this
# directory, it has no paths filter to edit, and it fires on every pull request.
# So a docs-only PR shows exactly one check — that CodeQL run, ~35s — and no
# `ci` run at all. That is the intended state, not a filter that failed to
# apply. Making CodeQL path-aware would mean switching to advanced setup (a
# committed `codeql.yml` plus disabling default setup in repository settings)
# and taking on the workflow's upkeep; the decision was to keep default setup.
on:
  push:
    branches: [main]
    paths: &paths
      - "rigging/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "redteam/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/**"
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra service --extra mcp --extra vault
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "not live and not browser" --cov=rigging --cov-report=term-missing
        env:
          RIGGING_DB_PATH: rigging.db

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra service --extra browser
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser
