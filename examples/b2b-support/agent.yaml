# The canonical demo agent (ADR-0016, examples/README.md).
# A B2B procurement and refunds assistant that escalates when it should.
name: b2b-support
description: Answers B2B procurement, pricing and refund questions; escalates to a human when out of policy or uncertain.

model: deepseek/deepseek-v4.1-flash
credential_profile: openrouter

system_prompt_file: prompt.md
skills_dir: skills
skills:
  - procurement-policy
  - escalation-summary

tools:
  - search_policies
  - lookup_order
  - search_catalogue
  - check_pricing
  - add_to_basket
  - view_basket
  - update_basket_item
  - clear_basket
  - submit_basket
  - refund_order
  - notify_customer
  - load_skill
  - escalate_to_human

# Zero-credential default: FTS5/BM25 over the chunks seed.py wrote into demo.db.
# Upgrade path (needs `ollama pull nomic-embed-text` + qdrant on :6345, then
# `make index`): swap name to qdrant and set url: ${QDRANT_URL}.
retriever:
  name: fts5
  options: {}

guardrails:
  on_input:
    - pii_pseudonymise            # ADR-0025: [EMAIL_1] to the model, real value to tools
  on_tool_call:
    - pii_pseudonymise            # sentinels in the args come back as the real value
    - name: consequential_action
      config:
        max_amount_usd: 500
        amount_arg: amount
    - name: refund_window          # found by the eval suite: policy prose is not enforcement
      config:
        max_days: 30
  on_tool_result:
    - pii_pseudonymise            # a tool that returns a contact hands back the sentinel
    - prompt_injection
  on_output:
    - pii_pseudonymise
    - commitment_check

approval:
  policy: cli
  side_effecting_tools:
    - refund_order
    - submit_basket

limits:
  max_steps: 20
  max_tokens: 60000
  max_cost_usd: 0.50
  max_wall_clock_s: 180

# No exporters by default: `make demo|web|eval EXPORT=langfuse` (or
# `harness run|chat|serve --export langfuse`) overlays this list at assembly
# time, so the manifest stays key-free (ADR-0012).
observability:
  exporters: []
  capture_content: true
