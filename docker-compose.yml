# Profiles (ADR: reproducibility):
#   (default)      omniroute            — one OpenAI-compatible endpoint
#   observability  + langfuse, postgres  — tracing UI
#   retrieval      + qdrant              — policy index, port 6345 to avoid the
#                                          host's existing Qdrant stacks (6333,
#                                          6335, 6340 are taken)
# `make hello` works with no profile keys at all: Ollama runs on the host.

services:
  omniroute:
    image: node:22-alpine
    command: sh -c "npm install -g omniroute && omniroute serve --port 20128 --host 0.0.0.0"
    ports:
      - "20128:20128"
    environment:
      OMNIROUTE_SELF_HOSTED_PROVIDERS: |
        providers:
          - id: ollama
            type: openai-compatible
            apiType: chat
            baseUrl: http://host.docker.internal:11434/v1
          - id: openrouter
            type: openai-compatible
            apiType: chat
            baseUrl: https://openrouter.ai/api/v1
    volumes:
      - omniroute-data:/root/.omniroute
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: ["retrieval", "observability"]
    ports:
      - "6345:6333"
      - "6346:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    profiles: ["observability"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - pg-data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:3
    profiles: ["observability"]
    depends_on: [postgres]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-real-deployments
      SALT: change-me-too
      TELEMETRY_ENABLED: "false"

volumes:
  omniroute-data:
  qdrant-data:
  pg-data:
