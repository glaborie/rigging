# Profiles (ADR: reproducibility):
#   (default)      omniroute                    — one OpenAI-compatible endpoint
#   retrieval      + qdrant on :6345            — policy index, port 6345 to avoid
#                                                 the host's existing Qdrant stacks
#                                                 (6333, 6335, 6340 are taken)
#   librechat      + LibreChat on :3080         — a chat UI for `make openai`
#                                                 (ADR-0028); MongoDB included
# `make hello` works with no profile keys at all: Ollama runs on the host.
#
# Traces go to Langfuse **Cloud**: there is no local observability stack to boot.
# Set LANGFUSE_HOST / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY in .env and use
# `exporters: [langfuse]` in the manifest (see examples/observability/agent.yaml).

services:
  omniroute:
    # Baked image (Dockerfile.omniroute, omniroute pinned to 3.8.52): npm no
    # longer runs on every boot. 3.8.52 removed `serve --port/--host` — bind via
    # OMNIROUTE_SERVER_HOST, port via PORT (below).
    build:
      context: .
      dockerfile: Dockerfile.omniroute
    image: rigging/omniroute:3.8.52
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      PORT: "20128"
      OMNIROUTE_SERVER_HOST: 0.0.0.0
      # Bootstrap dashboard password, seeded on FIRST boot only. Change it in
      # Dashboard -> Settings -> Security afterwards; later restarts ignore it.
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:-CHANGEME}
      # Self-hosted entry schema (docs: Self-Hosted OpenAI-Compatible Entry):
      # kind: openai|anthropic|local, and `model` is REQUIRED — it is the default
      # for unprefixed requests. Do NOT use the provider-node shape (type/apiType);
      # that belongs to the dashboard config, and a config that fails to parse
      # makes /v1/chat/completions return 500 instead of silently falling through.
      # Route per request: model "freellm/<id>" or header x-omniroute-provider: freellm.
      #
      # The static self-hosted pool is disabled. With it enabled the router only
      # considered freellm/ollama, so a model on a dashboard connection
      # (openrouter, or any OAuth provider) fell back to those two and returned
      # 503 "no eligible
      # providers": freellm has no key (401) and the harness uses local Ollama
      # directly, not through OmniRoute. Dashboard connections route now.
      # OMNIROUTE_SELF_HOSTED_PROVIDERS: |
      #   providers:
      #     - id: freellm
      #       kind: openai
      #       baseUrl: http://host.docker.internal:3001/v1
      #       model: codestral
      #       apiKey: ${FREELLM_API_KEY}
      #     - id: ollama
      #       kind: openai
      #       baseUrl: http://host.docker.internal:11434/v1
      #       model: qwen3:8b
    volumes:
      - omniroute-data:/root/.omniroute
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: ["retrieval"]
    ports:
      - "6345:6333"
      - "6346:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  # A chat UI for the opt-in OpenAI-compatible surface (ADR-0028). The harness
  # runs on the host (`make openai`); the container reaches it through the Docker
  # gateway. The shared secret is RIGGING_SERVICE_TOKEN; without it LibreChat's
  # custom endpoint answers "Missing API Key" and nothing runs.
  librechat:
    image: registry.librechat.ai/librechat-ai/librechat-dev:latest
    profiles: ["librechat"]
    container_name: rigging-librechat
    ports:
      - "127.0.0.1:${LIBRECHAT_PORT:-3080}:3080"
    depends_on:
      - librechat-mongo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://librechat-mongo:27017/LibreChat
      CONFIG_PATH: /app/librechat.yaml
      DOMAIN_CLIENT: http://localhost:${LIBRECHAT_PORT:-3080}
      DOMAIN_SERVER: http://localhost:${LIBRECHAT_PORT:-3080}
      RIGGING_SERVICE_TOKEN: ${RIGGING_SERVICE_TOKEN:-}
      RIGGING_LIBRECHAT_BASE_URL: ${RIGGING_LIBRECHAT_BASE_URL:-http://host.docker.internal:8000/v1}
      ALLOW_REGISTRATION: "true"
      ALLOW_EMAIL_LOGIN: "true"
      DEBUG_LOGGING: "false"
    volumes:
      - ./examples/librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat-images:/app/client/public/images
      - librechat-uploads:/app/uploads
      - librechat-logs:/app/logs
      - librechat-data:/app/data

  librechat-mongo:
    image: mongo:8.0.20
    profiles: ["librechat"]
    container_name: rigging-librechat-mongo
    command: mongod --noauth
    volumes:
      - librechat-mongo-data:/data/db

volumes:
  omniroute-data:
  qdrant-data:
  librechat-images:
  librechat-uploads:
  librechat-logs:
  librechat-data:
  librechat-mongo-data:
