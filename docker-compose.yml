# Profiles (ADR: reproducibility):
#   (default)      omniroute            — one OpenAI-compatible endpoint
#   observability  + langfuse, postgres  — tracing UI
#   retrieval      + qdrant              — policy index, port 6345 to avoid the
#                                          host's existing Qdrant stacks (6333,
#                                          6335, 6340 are taken)
# `make hello` works with no profile keys at all: Ollama runs on the host.

services:
  omniroute:
    # Baked image (Dockerfile.omniroute, omniroute pinned to 3.8.52): npm no
    # longer runs on every boot. 3.8.52 removed `serve --port/--host` — bind via
    # OMNIROUTE_SERVER_HOST, port via PORT (below).
    build:
      context: .
      dockerfile: Dockerfile.omniroute
    image: rigging/omniroute:3.8.52
    ports:
      - "20128:20128"
    environment:
      PORT: "20128"
      OMNIROUTE_SERVER_HOST: 0.0.0.0
      # Bootstrap dashboard password, seeded on FIRST boot only. Change it in
      # Dashboard -> Settings -> Security afterwards; later restarts ignore it.
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:-CHANGEME}
      # Self-hosted entry schema (docs: Self-Hosted OpenAI-Compatible Entry):
      # kind: openai|anthropic|local, and `model` is REQUIRED — it is the default
      # for unprefixed requests. Do NOT use the provider-node shape (type/apiType);
      # that belongs to the dashboard config, and a config that fails to parse
      # makes /v1/chat/completions return 500 instead of silently falling through.
      # Route per request: model "freellm/<id>" or header x-omniroute-provider: freellm.
      OMNIROUTE_SELF_HOSTED_PROVIDERS: |
        providers:
          - id: freellm
            kind: openai
            baseUrl: http://host.docker.internal:3001/v1
            model: codestral
            apiKey: ${FREELLM_API_KEY}
          - id: ollama
            kind: openai
            baseUrl: http://host.docker.internal:11434/v1
            model: qwen3:8b
    volumes:
      - omniroute-data:/root/.omniroute
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: ["retrieval", "observability"]
    ports:
      - "6345:6333"
      - "6346:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    profiles: ["observability"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - pg-data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:3
    profiles: ["observability"]
    depends_on: [postgres]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-real-deployments
      SALT: change-me-too
      TELEMETRY_ENABLED: "false"

volumes:
  omniroute-data:
  qdrant-data:
  pg-data:
