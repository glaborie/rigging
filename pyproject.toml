[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rigging"
version = "0.1.0"
description = "A modular agent harness: capabilities declared in a manifest, resolved through a registry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "<your name>" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.10"]
langfuse = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
mcp = ["mcp>=1.0"]
laya = ["laya>=0.3", "torch>=2.4", "transformers>=4.44"]
service = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = ["pytest>=8.2", "pytest-httpx>=0.30", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "jsonschema>=4.22"]

[project.scripts]
harness = "rigging.cli:main"

[project.entry-points."rigging.tools"]
# third-party packages register here:
# "my_tools" = "my_tools:register"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["rigging"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["rigging"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*", "qdrant_client.*", "laya.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["live: hits a real model or gateway; opt-in only"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
